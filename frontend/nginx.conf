# Configuracion de nginx para servir el frontend y hacer de puerta de entrada.
#
# nginx sirve los archivos estaticos y ademas pasa /api y /swagger al backend.
# Con eso el navegador ve UN SOLO ORIGEN, igual que con el proxy de Vite en
# desarrollo: no hay CORS de por medio y VITE_API_BASE=/api/v1 vale sin cambios
# en los dos entornos.

server {
    # El 8080 y no el 80 porque el contenedor corre como usuario sin
    # privilegios, y en Linux solo root puede abrir puertos por debajo del 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le quita la version de nginx a la cabecera Server: no hay por que decirle
    # a un escaner exactamente que version tiene que buscar.
    server_tokens off;

    # Comprimir el texto. Las imagenes y las fuentes ya vienen comprimidas y
    # volver a pasarlas por gzip solo gasta CPU.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad. Se incluyen aqui y otra vez en cada location que
    # define su propio add_header: ver el porque en seguridad.conf.
    include /etc/nginx/seguridad.conf;

    # --- La API -------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Sin estas dos, la bitacora del backend y su limite de peticiones por
        # IP verian a todo el mundo con la IP del contenedor de nginx.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La importacion de CSV admite hasta 2 MiB; el limite por defecto de
        # nginx es 1 MiB y cortaria el archivo antes de que llegue a la API.
        client_max_body_size 4m;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # La documentacion interactiva, servida por el mismo origen.
    #
    # En un despliegue publico de verdad este bloque se quita o se restringe:
    # describe la API entera. Aqui se deja porque es parte de la entrega.
    location /swagger {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # --- Los archivos del frontend ------------------------------------------

    # Vite le pone un hash del contenido al nombre de cada archivo de assets/.
    # Si el contenido cambia, cambia el nombre, asi que el archivo viejo se
    # puede cachear para siempre sin riesgo de servir algo obsoleto.
    location /assets/ {
        include /etc/nginx/seguridad.conf;
        # Un solo Cache-Control, no `expires` mas `add_header`: eso emitia la
        # cabecera dos veces con valores distintos.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # index.html es justo lo contrario: es el que nombra a los assets, asi que
    # cachearlo dejaria al navegador pidiendo la version anterior para siempre.
    location = /index.html {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fallback de aplicacion de una sola pagina.
    #
    # /transacciones no existe como archivo: las rutas las resuelve React en el
    # navegador. Sin esta linea, recargar en cualquier pagina que no sea la raiz
    # daria 404. Se sirve index.html y react-router se encarga.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
