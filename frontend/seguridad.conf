# Cabeceras de seguridad, en un archivo aparte para poder incluirlas en cada
# bloque que las necesita.
#
# No es una manía de orden: en nginx, un `location` que define su PROPIO
# add_header deja de heredar los del `server`. Con las cabeceras escritas una
# sola vez arriba, cualquier location que añadiera un Cache-Control se quedaba
# sin Content-Security-Policy sin avisar de nada. Incluir este archivo es la
# forma de que eso no pueda volver a pasar.

# Impide que el navegador adivine el tipo de un archivo por su contenido.
add_header X-Content-Type-Options "nosniff" always;

# Nadie puede meter la aplicacion dentro de un iframe (clickjacking).
add_header X-Frame-Options "DENY" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# La aplicacion no carga NADA de fuera: ni tipografias, ni analitica, ni CDN.
# Por eso la politica puede ser 'self' a secas.
#
# 'unsafe-inline' aparece por dos motivos concretos: el script en linea de
# index.html que aplica el tema antes del primer pintado, y los estilos que
# React escribe en el atributo style (los colores que el usuario le puso a sus
# categorias). connect-src queda en 'self' porque la API la sirve este mismo
# nginx, en el mismo origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
