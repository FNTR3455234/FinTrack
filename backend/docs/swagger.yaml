host: localhost:8080
info:
  contact: {}
  description: |-
    API REST de finanzas personales: cuentas, categorias, transacciones, presupuestos y reportes.
    Todos los datos pertenecen a un usuario. El identificador del dueño sale siempre del token, nunca del cuerpo de la peticion.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: FinTrack API
  version: 0.1.0
paths:
  /auth/login:
    post:
      description: Devuelve el mismo error si el correo no existe o si la contraseña
        es incorrecta, para no revelar que correos estan registrados.
      parameters:
      - description: Correo y contraseña
        in: body
        name: cuerpo
        required: true
        schema:
          $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.PeticionLogin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.Sobre'
            - properties:
                datos:
                  $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.RespuestaSesion'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
      summary: Iniciar sesion
      tags:
      - auth
  /auth/perfil:
    get:
      description: Datos del dueño del token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.Sobre'
            - properties:
                datos:
                  $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.Usuario'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
      security:
      - BearerAuth: []
      summary: Perfil del usuario
      tags:
      - auth
    put:
      description: Cambia el nombre y la moneda. El correo y la contraseña no se editan
        aqui.
      parameters:
      - description: Nombre y moneda
        in: body
        name: cuerpo
        required: true
        schema:
          $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.PeticionActualizarPerfil'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.Sobre'
            - properties:
                datos:
                  $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.Usuario'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
      security:
      - BearerAuth: []
      summary: Editar el perfil
      tags:
      - auth
  /auth/refresh:
    post:
      description: 'Devuelve SOLO un token de acceso nuevo: el de refresco sigue valido
        hasta que expire, a los 7 dias.'
      parameters:
      - description: Token de refresco
        in: body
        name: cuerpo
        required: true
        schema:
          $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.PeticionRefresco'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.Sobre'
            - properties:
                datos:
                  $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.RespuestaRefresco'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
      summary: Renovar el token de acceso
      tags:
      - auth
  /auth/registro:
    post:
      description: Da de alta la cuenta y devuelve la sesion ya iniciada.
      parameters:
      - description: Datos del usuario
        in: body
        name: cuerpo
        required: true
        schema:
          $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.PeticionRegistro'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.Sobre'
            - properties:
                datos:
                  $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.RespuestaSesion'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
      summary: Registrar un usuario
      tags:
      - auth
  /categorias:
    get:
      description: Solo las del usuario del token.
      parameters:
      - description: Filtra por tipo
        enum:
        - ingreso
        - gasto
        in: query
        name: tipo
        type: string
      - description: Incluye tambien las archivadas
        in: query
        name: incluir_archivadas
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.Sobre'
            - properties:
                datos:
                  items:
                    $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.Categoria'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
      security:
      - BearerAuth: []
      summary: Listar categorias
      tags:
      - categorias
    post:
      parameters:
      - description: Datos de la categoria
        in: body
        name: cuerpo
        required: true
        schema:
          $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.PeticionCategoria'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.Sobre'
            - properties:
                datos:
                  $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_modelos.Categoria'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_FNTR3455234_FinTrack_backend_internal_respuestas.SobreError'
      security:
      - BearerAuth: []
      summary: Crear una categoria
      tags:
      - categorias
  /categorias/{id}:
    delete:
      description: Responde 409 si tiene movimientos o presupuestos.
      parameters:
      - description: Identificador de 24 caracteres
        in: path
        name: id
        required: true
        type: string
      produces:
